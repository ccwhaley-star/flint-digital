<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#2B2926;color:#F4F1EA;font-family:'Inter',sans-serif;overflow:hidden;position:relative}
  body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(244,241,234,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(244,241,234,.045) 1px,transparent 1px);background-size:74px 74px;-webkit-mask-image:linear-gradient(135deg,#000,transparent 75%)}
  .pad{position:relative;padding:80px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(244,241,234,.16);padding-bottom:22px;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#A8A299}
  .logo{font-family:'Fraunces',serif;font-weight:600;font-size:34px;color:#F4F1EA}
  .logo i{color:#E0A33E;font-style:normal}
  h1{font-family:'Fraunces',serif;font-weight:400;font-size:82px;line-height:1.04;letter-spacing:-.01em;max-width:14ch}
  h1 i{color:#E0A33E;font-style:italic}
  .foot{font-size:22px;color:#A8A299}
  .foot b{color:#F4F1EA;font-weight:600}
</style></head>
<body><div class="pad">
  <div class="top"><span class="logo">Flint<i>.</i>digital</span><span>Kansas City Area</span></div>
  <h1>Stop losing customers to <i>worse competitors.</i></h1>
  <div class="foot"><b>AI-first digital agency</b> &nbsp;·&nbsp; Websites · SEO · AEO · Google Ads</div>
</div></body></html>
