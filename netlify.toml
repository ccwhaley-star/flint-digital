[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/audit"
  to = "/.netlify/functions/audit-start"
  status = 200

[[redirects]]
  from = "/api/audit-result"
  to = "/.netlify/functions/audit-result"
  status = 200

# Fonts never change without a filename change — cache hard.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images change rarely; a week of caching is safe (filenames change with content).
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Host-level 301s: legacy hostnames hand everything to the primary domain
[[redirects]]
  from = "https://www.flintdigital.ai/*"
  to = "https://meridian6.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://flint-digital.netlify.app/*"
  to = "https://meridian6.ai/:splat"
  status = 301
  force = true
