<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; background: #F5F2EC;
    display: flex; align-items: center; justify-content: center; position: relative;
    font-family: 'Archivo', sans-serif;
  }
  .lock { display: flex; align-items: center; gap: 44px; }
  .mark { height: 210px; width: auto; }
  .word { font-weight: 400; font-size: 84px; letter-spacing: .005em; color: #16201C; }
  .six { color: #A0662C; font-weight: 700; }
  .tm { font-size: 22px; font-weight: 500; color: #5A6660; display: inline-block; transform: translateY(24px); margin-left: 8px; }
  .tag { position: absolute; left: 50%; transform: translateX(-50%); bottom: 120px;
    font-size: 27px; font-weight: 400; color: #5A6660; }
  .url { position: absolute; left: 50%; transform: translateX(-50%); bottom: 56px;
    font-family: 'IBM Plex Mono', monospace; font-size: 16px; letter-spacing: 2px; color: #A0662C; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap">
</head>
<body>
  <div class="lock">
    <svg class="mark" viewBox="-2 0 124 132">
      <g stroke="#16201C" stroke-width="1.5" opacity="0.45">
        <line x1="0" y1="26" x2="120" y2="26"/><line x1="0" y1="46" x2="120" y2="46"/>
        <line x1="0" y1="66" x2="120" y2="66"/><line x1="0" y1="86" x2="120" y2="86"/>
        <line x1="0" y1="106" x2="120" y2="106"/>
        <line x1="20" y1="6" x2="20" y2="126"/><line x1="40" y1="6" x2="40" y2="126"/>
        <line x1="80" y1="6" x2="80" y2="126"/><line x1="100" y1="6" x2="100" y2="126"/>
        <line x1="0" y1="6" x2="120" y2="6"/><line x1="0" y1="126" x2="120" y2="126"/><line x1="0" y1="6" x2="0" y2="126"/><line x1="120" y1="6" x2="120" y2="126"/>
      </g>
      <rect x="40" y="46" width="17" height="20" fill="#A0662C"/>
      <line x1="60" y1="0" x2="60" y2="132" stroke="#16201C" stroke-width="6"/>
    </svg>
    <span class="word">Meridian<span class="six">6</span></span>
  </div>
  <div class="tag">AI-first digital agency, built for small business, by small business.</div>
  <div class="url">meridian6.ai</div>
</body>
</html>
